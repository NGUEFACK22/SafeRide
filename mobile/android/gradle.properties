flutter.gradle.parallel = 1
flutter.gradle.multidex = 1
# Memoire reduite pour machine contrainte (6 Go RAM) : SerialGC + heap modere
# pour eviter les crashs JVM hs_err "insufficient memory" pendant le build.
org.gradle.jvmargs = -Xmx1280m -XX:MaxMetaspaceSize=512m -XX:+UseSerialGC -XX:SoftRefLRUPolicyMSPerMB=10 -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx768m
org.gradle.workers.max=1
org.gradle.parallel = false
org.gradle.caching = false
org.gradle.daemon = false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
android.useAndroidX=true
android.enableJetifier=true
