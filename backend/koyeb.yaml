services:
  - name: saferide-api
    router:
      routes:
        - paths:
            - /
    runtime: php
    plan: free
    root: backend
    build:
      buildpacks: []
      dockerfile: Dockerfile
    env:
      - name: APP_ENV
        value: production
      - name: APP_DEBUG
        value: "false"
      - name: APP_KEY
        sync: false # À définir dans le dashboard Koyeb (jamais en clair ici)
      - name: DB_CONNECTION
        value: pgsql
      - name: DB_HOST
        sync: false # Endpoint Neon — dashboard Koyeb uniquement
      - name: DB_PORT
        value: "5432"
      - name: DB_DATABASE
        value: neondb
      - name: DB_USERNAME
        sync: false # dashboard Koyeb uniquement
      - name: DB_PASSWORD
        sync: false # dashboard Koyeb uniquement — JAMAIS versionné
      - name: DB_SSLMODE
        value: require
      - name: DB_NEON_ENDPOINT
        sync: false # dashboard Koyeb uniquement
      - name: GOOGLE_CLIENT_ID
        sync: false # dashboard Koyeb uniquement
      - name: GOOGLE_ANDROID_CLIENT_ID
        sync: false # dashboard Koyeb uniquement
      - name: INFOBIP_BASE_URL
        value: https://api.infobip.com
      - name: INFOBIP_API_KEY
        sync: false # dashboard Koyeb uniquement — JAMAIS versionné
      - name: INFOBIP_SENDER
        value: SafeRide
      - name: AI_ENABLED
        value: "true"
      - name: AI_BASE_URL
        value: https://api.mistral.ai/v1
      - name: AI_API_KEY
        sync: false # dashboard Koyeb uniquement — JAMAIS versionné
      - name: AI_MODEL
        value: mistral-small-latest
