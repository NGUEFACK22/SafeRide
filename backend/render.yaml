services:
  - type: web
    name: saferide-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false # Dashboard Render uniquement — JAMAIS en clair ici
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        sync: false # Endpoint Neon — dashboard Render uniquement
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        value: neondb
      - key: DB_USERNAME
        sync: false # dashboard Render uniquement
      - key: DB_PASSWORD
        sync: false # dashboard Render uniquement — JAMAIS versionné
      - key: DB_SSLMODE
        value: require
      - key: GOOGLE_CLIENT_ID
        sync: false # dashboard Render uniquement
      - key: GOOGLE_ANDROID_CLIENT_ID
        sync: false # dashboard Render uniquement
      - key: INFOBIP_BASE_URL
        value: https://api.infobip.com
      - key: INFOBIP_API_KEY
        sync: false # dashboard Render uniquement — JAMAIS versionné
      - key: INFOBIP_SENDER
        value: SafeRide
      - key: AI_ENABLED
        value: "true"
      - key: AI_BASE_URL
        value: https://api.mistral.ai/v1
      - key: AI_API_KEY
        sync: false # dashboard Render uniquement — JAMAIS versionné
      - key: AI_MODEL
        value: mistral-small-latest
      - key: AI_TIMEOUT
        value: "20"
      - key: DIDIT_API_KEY
        sync: false # dashboard Render uniquement — JAMAIS versionné
      - key: DIDIT_BASE_URL
        value: https://verification.didit.me/v3
      - key: INFOBIP_WHATSAPP_SENDER
        value: ""
      - key: MAIL_MAILER
        value: resend-http
      - key: MAIL_FROM_ADDRESS
        value: onboarding@resend.dev
      - key: MAIL_FROM_NAME
        value: SafeRide
      # RESEND_API_KEY : à définir dans le dashboard Render (Env Vars > Add),
      # jamais en clair dans le repo (GitHub Push Protection la bloque).
      - key: RESEND_API_KEY
        sync: false
      - key: DB_NEON_ENDPOINT
        sync: false # dashboard Render uniquement
